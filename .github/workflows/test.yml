name: Validate GB Sign
on:
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm ci --prefix functions
      - run: npm test --prefix functions
      - run: node --check functions/index.js
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
      - run: npx --yes firebase-tools@15.22.1 emulators:exec --project demo-gb-sign-access --only firestore,storage "node tests/signatureAccess.emulator.mjs"
      - run: npm run build
